toggle_hour:
  name: Toggle Hour
  description: "Cycle an hour through idle → charge → pv_charge → discharge → blocked → idle"
  fields:
    hour:
      name: Hour
      description: "Hour to toggle (0-23)"
      required: true
      example: 14
      selector:
        number:
          min: 0
          max: 23
          step: 1
    date:
      name: Date
      description: "Date for the schedule slot (YYYY-MM-DD). Defaults to today."
      required: false
      example: "2026-05-02"
      selector:
        date:

set_hour_action:
  name: Set Hour Action
  description: "Set a specific hour to charge, discharge, or idle"
  fields:
    hour:
      name: Hour
      description: "Hour (0-23)"
      required: true
      example: 14
      selector:
        number:
          min: 0
          max: 23
          step: 1
    action:
      name: Action
      description: "Target action for this hour"
      required: true
      example: "charge"
      selector:
        select:
          options:
            - "idle"
            - "charge"
            - "pv_charge"
            - "discharge"
            - "blocked"
    date:
      name: Date
      description: "Date for the schedule slot (YYYY-MM-DD). Defaults to today."
      required: false
      example: "2026-05-02"
      selector:
        date:

