title: Victron Dashboard Dev
views:
  - title: Overview
    path: overview
    cards:
      - type: custom:victron-charge-controller-card
        entity_prefix: victron_charge_control
        view: overview
        title: Charge Control Overview

  - title: Settings
    path: settings
    cards:
      - type: custom:victron-charge-controller-card
        entity_prefix: victron_charge_control
        view: settings
        title: Charge Control Settings

  - title: Plan
    path: plan
    cards:
      - type: custom:victron-charge-controller-card
        entity_prefix: victron_charge_control
        view: plan
        title: Charge Plan

  - title: History
    path: history
    cards:
      - type: custom:victron-charge-controller-card
        entity_prefix: victron_charge_control
        view: history
        title: History

  - title: Dev Controls
    path: dev-controls
    cards:

      # Helper cards to adjust dummy sensor values
      - type: entities
        title: Dev Controls
        show_header_toggle: false
        entities:
          - entity: input_number.battery_soc_value
            name: Battery SOC
          - entity: input_number.grid_setpoint_store
            name: Grid Setpoint
          - entity: input_number.max_grid_feed_in_store
            name: Max Grid Feed-in
          - entity: input_number.grid_consumption_kwh_value
            name: Grid Consumption kWh
          - entity: input_number.grid_feed_in_kwh_value
            name: Grid Feed-in kWh

      - type: sensor
        entity: sensor.epex_spot_price
        name: EPEX Spot Price
        graph: line
        hours_to_show: 24
